# 一键启动：cd deploy && docker compose up -d --build
#
# 服务拓扑：
#   frontend (nginx:80)  →  反代 /api 到 backend:3000
#   backend  (node:3000) →  读写 SQLite（卷持久化）
#
# 访问：
#   前端    http://localhost
#   后端 API http://localhost:3000/api/v1/health
#   Swagger http://localhost:3000/api-docs
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:./dev.db
      # 生产务必改用 openssl rand -hex 32 生成的强密钥
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production-32chars}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost,http://localhost:5173
    volumes:
      - backend-data:/app/prisma
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
